<!DOCTYPE html>
<html>

<head>

    <title>Todo List App</title>

    <style>

        body{
            font-family: Arial;
            background: linear-gradient(to right,#74ebd5,#ACB6E5);
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .box{
            width: 420px;
            background-color: white;
            margin: auto;
            margin-top: 50px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px gray;
        }

        h2{
            color: darkblue;
        }

        input,select,textarea{
            width: 90%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid gray;
            font-family: Arial;
        }

        button{
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .addbtn{
            background-color: green;
            color: white;
        }

        .deletebtn{
            background-color: red;
            color: white;
        }

        .task{
            background-color: #f1f8ff;
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
        }

        .count{
            margin-top: 15px;
            font-weight: bold;
            color: darkgreen;
        }

        .desc-text{
            color: #444;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h2>📝 Todo List App</h2>

        <!-- TASK INPUT -->
        <input type="text" id="task" placeholder="Enter Task">

        <!-- DESCRIPTION INPUT (NEW) -->
        <textarea id="desc" placeholder="Enter Description"></textarea>

        <!-- CATEGORY -->
        <select id="category">

            <option value="Study">Study</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>

        </select>

        <button class="addbtn" onclick="addTask()">Add Task</button>

        <div class="count" id="count"></div>

        <div id="result"></div>

    </div>

    <script>

        let tasks =
        JSON.parse(localStorage.getItem("tasks")) || [];

        showTasks(tasks);

        function addTask(){

            let taskname =
            document.getElementById("task").value;

            let desc =
            document.getElementById("desc").value;

            let category =
            document.getElementById("category").value;

            if(taskname == ""){
                alert("Please Enter Task");
                return;
            }

            let obj = {
                task: taskname,
                desc: desc,
                type: category
            };

            tasks.push(obj);

            localStorage.setItem("tasks", JSON.stringify(tasks));

            showTasks(tasks);

            document.getElementById("task").value = "";
            document.getElementById("desc").value = "";

        }

        function showTasks(data){

            let output = "";

            for(let i=0;i<data.length;i++){

                output +=

                "<div class='task'>" +
                "<h3>" + data[i].task + "</h3>" +
                "<p class='desc-text'>📝 " + data[i].desc + "</p>" +
                "<p>Category: " + data[i].type + "</p>" +
                "<button class='deletebtn' onclick='deleteTask(" + i + ")'>Delete</button>" +
                "</div>";

            }

            document.getElementById("result").innerHTML = output;
            document.getElementById("count").innerHTML =
            "Total Tasks: " + data.length;

        }

        function deleteTask(index){

            tasks.splice(index,1);

            localStorage.setItem("tasks", JSON.stringify(tasks));

            showTasks(tasks);

        }

    </script>

</body>

</html>
